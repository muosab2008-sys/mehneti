<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مهنتي 2026 | المنصة الذكية</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        /* إضافة متغيرات الألوان لدعم النمطين الفاتح والغامق */
        :root {
            --primary-color: #2563eb;
            --bg-color: #020617;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        .light-theme {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            transition: all 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-profile {
            display: none; /* يظهر فقط بعد تسجيل الدخول */
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
        }

        .ai-tracker-bar {
            background: linear-gradient(90deg, var(--primary-color), transparent);
            padding: 10px 5%;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
        }

        .hero-section {
            text-align: center;
            padding: 100px 5%;
        }

        .btn-main {
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            background: var(--primary-color);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-main:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
        }

        #g_id_signin {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎓 مهنتي 2026</a>
        
        <div class="nav-actions">
            <button onclick="toggleTheme()" class="btn-main" style="padding: 8px 15px; background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color);">🌓</button>
            
            <div id="user-info" class="user-profile">
                <span id="user-name"></span>
                <img id="user-pic" class="user-avatar" src="" alt="User">
                <button onclick="logout()" style="background:none; border:none; color:red; cursor:pointer; font-family:inherit;">خروج</button>
            </div>

            <div id="g_id_onload"
                 data-client_id="787882830858-pljl7lsv4h7dlfh53jggq2lc64klk4jp.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
        </div>
    </header>

    <div class="ai-tracker-bar" id="tracker">
        🤖 الذكاء الاصطناعي: جاهز لتحليل مسارك المهني.. سجل دخولك للبدء.
    </div>

    <section class="hero-section">
        <h1 style="font-size: 3rem; margin-bottom: 20px;">مستقبلك المهني يبدأ من هنا</h1>
        <p style="font-size: 1.2rem; opacity: 0.8; max-width: 700px; margin: 0 auto 30px;">
            منصة "مهنتي 2026" تستخدم أحدث تقنيات الذكاء الاصطناعي لتحليل مهاراتك وربطها بأفضل الجامعات في العالم.
        </p>
        <a href="assessment.html" class="btn-main">ابدأ اختبار التحليل الذكي</a>
    </section>

    <script>
        // 1. نظام تبديل النمط
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        // استعادة النمط المفضل للمستخدم
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
        }

        // 2. معالجة دخول جوجل
        function handleCredentialResponse(response) {
            // فك تشفير البيانات القادمة من جوجل (JWT)
            const responsePayload = parseJwt(response.credential);

            // تحديث الواجهة
            document.querySelector('.g_id_signin').style.display = 'none';
            const userInfo = document.getElementById('user-info');
            userInfo.style.display = 'flex';
            document.getElementById('user-name').innerText = responsePayload.name;
            document.getElementById('user-pic').src = responsePayload.picture;

            // تتبع الذكاء الاصطناعي
            document.getElementById('tracker').innerText = `🤖 مرحباً ${responsePayload.given_name}، سأقوم الآن بتخصيص النتائج بناءً على ملفك الشخصي.`;
            
            // حفظ البيانات في LocalStorage لتعمل في الصفحات الأخرى
            localStorage.setItem('userLoggedIn', 'true');
            localStorage.setItem('userName', responsePayload.name);
            localStorage.setItem('userPic', responsePayload.picture);
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        // 3. التحقق من الدخول عند تحميل الصفحة
        window.onload = function() {
            if (localStorage.getItem('userLoggedIn') === 'true') {
                document.querySelector('.g_id_signin').style.display = 'none';
                const userInfo = document.getElementById('user-info');
                userInfo.style.display = 'flex';
                document.getElementById('user-name').innerText = localStorage.getItem('userName');
                document.getElementById('user-pic').src = localStorage.getItem('userPic');
            }
        }
    </script>
</body>
</html>
